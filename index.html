<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Thumbnail theme</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500&display=swap" />
    <style>
      body {
        font-family: 'Google Sans', sans-serif;
        margin: 24px;
      }
      .scene {
        display: flex;
        gap: 16px;
        margin-bottom: 24px;
      }
      .stage {
        position: relative;
        border: 1px solid #ddd;
      }
      .stage img.overlay {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .ref {
        border: 1px solid #ddd;
      }
    </style>
  </head>
  <body>
    <p>
      Left: Blockly with the thumbnail theme and renderer. Right: the original
      thumbnail.
      <label>
        Overlay original:
        <input id="overlay" type="range" min="0" max="1" step="0.05" value="0" />
      </label>
      <a href="playground.html">Playground</a>
    </p>
    <div id="scenes"></div>
  </body>
</html>
