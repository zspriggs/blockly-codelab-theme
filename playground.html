<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Thumbnail playground</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500&display=swap" />
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        font-family: 'Google Sans', sans-serif;
      }
      body {
        display: flex;
        flex-direction: column;
      }
      header {
        display: flex;
        gap: 12px;
        align-items: center;
        padding: 8px 12px;
        border-bottom: 1px solid #ddd;
        font-size: 14px;
      }
      #blocklyDiv {
        flex: 1;
      }
    </style>
  </head>
  <body>
    <header>
      <strong>Thumbnail playground</strong>
      <span>The workspace is saved in this browser automatically.</span>
      <button id="clear">Clear workspace</button>
      <a href="index.html">Comparison with originals</a>
    </header>
    <div id="blocklyDiv"></div>
  </body>
</html>
